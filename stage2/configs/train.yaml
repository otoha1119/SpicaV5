# stage2/configs/train.yaml — Stage 2 学習パラメータ（数値・症例リスト）。唯一の正は configs/schema.py の TRAIN（キーの欠落・未知・型違いはエラー）。既定値は無い。
# 論文 = ILUMENATE（Koons et al., Med Phys 2025;52(7):e17874）。書き方: 小数は必ず点を付ける。真偽値は true / false。リストは [a, b]。
# 実験名 (run) はここに書かない。run_train.py が起動時刻 yyyy_mmdd_HHMM から生成する（レイアウトは util/run_paths.py）。
# 設計: docs/plans/20260908_stage2-unet-implementation-spec.md §4

optim:
  lr: 0.001             # 論文 "Adam optimizer with a learning rate of 0.001"。減衰なし（一定）
  beta1: 0.9            # 論文は Keras の Adam を lr 以外既定で使用 → Keras 既定 (0.9, 0.999)。Stage 1 の 0.5 は GAN 慣行なので採らない
  beta2: 0.999
  batch_size: 16        # 論文未記載。ユーザー決定 2026-09-08: まず 16、様子を見て変える
  n_epochs: 100         # 論文 "Training consisted of 100 epochs"
  seed: 0               # python / numpy / torch の乱数 seed（再現条件）
  precision: bf16       # 学習の forward だけ CUDA autocast（Stage 1 と同じ高速化、2026-11-03）。損失・val・推論は FP32。fp32 で従来どおり
  compile: true         # 学習の forward を torch.compile(max-autotune)。初回だけコンパイルで遅い。val・推論は compile しない

data:
  patch_size: 128       # 論文 "Patches of size 128 × 128 pixels"（1024 グリッド上）。ユーザー決定 128
  samples_per_epoch: 64000   # 1 epoch のサンプル数（random sampling）。論文の 1 epoch ≈ 61,101 組に合わせる。batch 16 → 4,000 step/epoch
  patch_seed: 0         # serial_batches=true のときの決定的サンプリング用
  patches_per_slice: 8  # 1 回読んだペア（入力 + 教師、各 2 MB）から連続して切る patch 数（位置は毎回独立）。1 = patch ごとに別ペア（2026-10-12 以前）。Stage 1 で 8 にして大幅高速化したので同じ（ユーザー指示 2026-10-12）
  hu_offset: 1400       # stored = HU + 1400（Stage 1 と同じ）
  hu_min: -1400         # 正規化窓 [−1400, 4096] → [−1, 1]（Stage 1 と同じ。final_act=tanh でも同じ範囲）
  hu_max: 4096
  # 症例分割（ユーザー決定 2026-09-08）。ディスク上の症例は必ずどれかのリストに入っていること（未割当があれば起動時にエラー）。
  # 後で train 1〜16 / val 17, 18 / test 19, 20 に変えるときはここを書き換える（実効値は run の launch.yaml に残る）
  train_cases: [PCD-003, PCD-004, PCD-005, PCD-006, PCD-007, PCD-008, PCD-009, PCD-010, PCD-011, PCD-012, PCD-013, PCD-014, PCD-015, PCD-016]   # 学習に使う症例。ディスク上に無くてもよい（学習中に読み込まない）
  val_cases: [PCD-017, PCD-018]          # epoch 末の指標だけに使う（学習には使わない）
  test_cases: [PCD-001, PCD-002, PCD-019, PCD-020]   # 最終評価用。学習・検証で一切読まない（ディスクに無くてもよい）。例外は log.full_slice の 1 枚（目視用。ユーザー決定 2026-09-09）

aug:                      # 学習入力（EID-like1024 patch）だけの augmentation。教師・val・固定 patch・フル画像には掛けない（data/augment.py、2026-11-08 ブランチ 022）。両方 0.0 = main と同じ
  blur_sigma_max: 0.0     # σ ~ U[0, 値] px の Gaussian ぼかし（1024 グリッド）。入力のぼけ量を族にする（機構分析 §5.4 D2、R-S26）。例 1.0
  hf_phase_cutoff: 0.0    # この周波数 [cycles/px、1024 グリッド] 以上の位相を毎回乱数に（振幅 = ノイズ量は保つ）。教師の実現値の読み戻し（§5.4 D1）を断つ。512 換算は 2 倍。例 0.1（= 512 の 0.2）

adv:                      # 出力側 D（2026-11-09 ブランチ 023、研究者の設計 2026-10-12「MSE + 実 EID 出力側 D」）。lambda 0.0 = D なし（main と同じ）
  lambda: 0.0             # 損失 = MSE + λ · L_adv。例 0.001（MSE ≈ 5e-4、L_adv ≈ 0.25 の桁合わせ）
  source: eid             # 偽物 = eid（実 EID1024 = eid1024_dir の patch を G に通した出力）| eidlike（ペアの出力、SRGAN 型）| both。本物 = ペアの教師 PCD1024 patch
  gan_mode: lsgan         # lsgan | vanilla
  lr_d: 0.0001            # D の Adam lr（β 0.5, 0.999）
  ndf: 64                 # 70×70 PatchGAN の基本チャネル数
  lf_lambda: 0.0          # 実 EID の経路の低周波整合項 λ_lf · ‖g_σ ∗ S2(e) − g_σ ∗ e‖²（2026-11-09 ブランチ 025。D が構造・HU 水準を動かすのを抑え、テクスチャだけを変えさせる）。0.0 で無し。正規化空間の MSE（例 1.0 = ペアの MSE と同じ重み）
  lf_sigma: 4.0           # その Gaussian の σ（1024 の画素）

ema:                      # G の重みの指数移動平均（2026-11-09 ブランチ 024。GAN 項で epoch ごとに出力が振れる対策。学習は変えず、評価・保存に平均した重みを使う）
  decay: 0.0              # 0.0 = 無し。例 0.999（直近 ≈ 1,000 step の平均、1 epoch は 4,000 step）。val / best / net_G.pth は EMA、学習中の重みは net_G_raw.pth に別保存

log:
  print_freq: 100               # バー末尾の損失・TensorBoard scalar・loss_log.txt の更新間隔（step = batch_size 枚）
  image_freq: 500                # TensorBoard に学習中の 128 patch グリッドを出す間隔（step。batch 16 なら 1 epoch = 4,000 step → 8 回/epoch）。Stage 1 と同じ仕組み（2026-09-09）
  n_images: 2                    # そのグリッドの行数（ユーザー指示 2026-09-09: 4 → 2）。images/current = いまのバッチ先頭 n 枚、images/fixed = log.full_slice から切った固定 n 枚（patch_seed で位置を決める）。列は [EID-like(入力) | PCD-like(出力) | PCD1024(教師)]
  save_epoch_freq: 1             # 毎 epoch 重み（weights/epoch_NNN/）を保存し、後から最良 epoch を選べるようにする（net_G.pth 約 39 MB + state.pth 約 78 MB → 100 epoch で約 12 GB）
  save_latest_freq: 6400         # latest/ の保存間隔（画像枚数。batch 16 なら 400 step ごと）
  val_max_slices_per_case: 100   # epoch 末の検証で val 症例ごとに使うフル 1024 スライスの上限（等間隔に間引く。0 で全部 ≈ 1,000 枚/症例）
  best_metric: rmse              # best/ を自動更新する val の指標（rmse = 最小更新 | ssim | psnr = 最大更新）。毎 epoch の val の後に判定して best/ と best.txt を書く（2026-09-09）。
                                 # 手動で選び直すときは bash start2.sh best <run> <epoch>（weights/epoch_NNN/ → best/。以後の自動更新はその run を resume したときだけ）
  # epoch 末のフル 1024 画像（Stage 1 と同じ 2 系統: output_images/epoch_NNN/ の生 16bit と preview_*/ の表示用。TensorBoard にも同じパネル。ユーザー決定 2026-09-09）
  full_slice: PCD-002/PCD-002-236.png   # 固定スライス（test の症例 PCD-002 = holdout を目視用に毎 epoch 見る。ユーザー決定 2026-09-09。best の選択は val の指標で行い、この絵で選ばない）。
                                        # eidlike1024_dir / pcd1024_dir 両方からの相対パス → epoch_NNN/PCD-002-236_{eidlike,pcd1024,pcdlike}.png, preview_fixed_PCD-002-236/, TB images/full/fixed と images/fixed の patch
  eid_slice: EID-049/EID-049-079.png    # 実 EID のテストスライス（eid_dir = EID_v5 からの相対パス）。毎 epoch 1 枚だけ 512 → 1024 に補間（eidlike1024_dir/manifest.yaml の方式）して U-Net に通す → 固定パネルの 4 列目
  n_full_random: 1        # epoch ごとに別のランダムスライス（**val だけ**から。学習に使ったスライスは記憶で良く見えるので汎化の目視にならない。ユーザー決定 2026-09-09）→ epoch_NNN/<slice>_{eidlike,pcd1024,pcdlike}.png, preview_random/, TB images/full/random（3 列）
  tb_full_size: 512       # TensorBoard の images/full/* のフル画像の一辺。1024 は TB で拡大が効かないので 512 に縮小して出す（ディスクの preview_*/ と epoch_NNN/ は 1024 のまま。ユーザー指示 2026-09-09）
  preview_bits: 16        # preview_*/ のビット深度。16 = 表示範囲（stored 0〜4400）を 0..65535 に伸ばす（Stage 1 と同じ）| 8
  display_hu_min: -1400   # 表示の線形範囲（Stage 1 と同じ）。stored 0 = HU −1400 を黒
  display_hu_max: 3000    # stored 4400 = HU 3000 を白。窓は掛けない
