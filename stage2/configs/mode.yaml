# stage2/configs/mode.yaml — アルゴリズムのモード切替（数値ではなく「どの方式か」）。唯一の正は configs/schema.py の MODE。既定値は無い。
# 論文 = ILUMENATE（Koons et al., Med Phys 2025）Fig. 2 の U-Net をそのまま組むのが既定。変種は ablation 用。

arch: unet_ilumenate    # Conv3×3(zero pad)+ReLU ×2 を 3 段（128 / 256 / 512）、max pool 2 回、up-conv（ConvTranspose 2×2 s2）2 回、skip concat、BN・dropout なし、最終 Conv3×3 → 1ch
base_ch: 128            # 論文 "128 filters at the first layer doubling at each max pooling layer"
n_pool: 2               # 論文 "2 max pooling and 2 up-convolutional layers"
init_type: xavier_uniform   # Keras 既定（Glorot uniform、bias 0）に合わせる | torch（PyTorch 既定）
loss: mse               # 論文 Eq. 1（MSE）| l1（ablation）。正規化空間 [−1,1] で計算し、表示は HU 換算の RMSE も出す
final_act: linear       # 論文（活性化なしの回帰）| tanh（出力を [−1,1] に縛る変種。正規化範囲 [−1400, 4096] HU がそのまま値域になる）
residual: false         # true で 出力 = 入力 + net(入力)（変種。論文は false）
serial_batches: false   # true で sampler を index 決定的に（再現用）
