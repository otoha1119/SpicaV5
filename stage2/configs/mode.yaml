# stage2/configs/mode.yaml — アルゴリズムのモード切替（数値ではなく「どの方式か」）。唯一の正は configs/schema.py の MODE。既定値は無い。
# 既定は ILUMENATE の Conv / channel / skip を保ち、解像度変換だけ Stage 1 と同じ Haar wavelet にした Wavelet U-Net。
# 元論文の基準 U-Net は bash start2.sh --arch unet_ilumenate で選べる。

arch: wavelet_unet      # 128 / 256 / 512、Conv3×3+ReLU、通常 skip は維持。max pool → Haar DWT（HF を decoder へ直結）、up-conv → Conv1×1 + Haar IDWT。BN・dropout なし、最終 Conv3×3 → 1ch
base_ch: 128            # 論文 "128 filters at the first layer doubling at each max pooling layer"
n_pool: 2               # 解像度段数。unet_ilumenate は max pool / up-conv、wavelet_unet は DWT / IDWT の回数。論文は 2
init_type: xavier_uniform   # 論文に記載なし。Keras 既定（Glorot uniform、bias 0）に合わせる（読み）| torch（PyTorch 既定）
loss: mse               # 論文 Eq. 1（MSE）| l1（ablation）。正規化空間 [−1,1] で計算し、表示は HU 換算の RMSE も出す
final_act: linear       # 最終層の活性化。論文の図には 1ch への最終層が描かれておらず記載も無い → 回帰なので「無し」と読んだ（読み。docs/plans §4.3）| tanh（出力を [−1,1] に縛る変種）
residual: false         # true で 出力 = 入力 + net(入力)（変種。論文は false）
serial_batches: false   # true で sampler を index 決定的に（再現用）
