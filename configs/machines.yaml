mac:                                   # 開発機（Docker、CPU）
  gpu_gen: 0
  gpu_name: Apple M4 (CPU)
  host_data_root: /Volumes/OTO-SSD/DataSet   # SpicaV3 と同じ外付け SSD
  container_data_root: /workspace/DataSet
  pcd_dir: /workspace/DataSet/PCD512_v2
  eid_dir: /workspace/DataSet/EID_v5
  pcd1024_dir: /workspace/DataSet/PCD1024_v1         # Stage 2 の教師（PCD512_v2 と同一患者・同一スキャンの 1024 再構成、1ch uint16）。Stage 1 は使わない
  eidlike1024_dir: /workspace/DataSet/EIDlike1024_v1   # Stage 2 の学習入力 = bash start2.sh dataset の出力先（EID-like512 を ×2 補間）。存在しない状態で dataset を実行する。Stage 1 は使わない
  stage2_checkpoints_dir: /workspace/stage2/checkpoints   # Stage 2 の run（yyyy_mmdd_HHMM）の保存先。レイアウトは stage2/util/run_paths.py。Stage 1 は使わない
