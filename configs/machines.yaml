# configs/machines.yaml — マシン定義（Stage 共通）。唯一の正は stage1/configs/schema.py の MACHINE。
# 全環境 Docker 内で実行する。pcd_dir / eid_dir / checkpoints_dir は「コンテナ内から見えるパス」を書く。
# 推論（bash start.sh infer）もここの gpu_gen で Docker とデバイス（0 → cpu、それ以外 → cuda）を決める。重みと入力のパスは infer_stage1.sh に書く。
# host_data_root → container_data_root が Docker 起動時のマウント（start.sh が使う。詳細は Docker の項で別途）。

PC1:                                   # 研究室 Windows 機
  gpu_gen: 30                          # 30 | 40 | 50 | 0(CPU)。起動する compose の選択に使う
  gpu_name: RTX 3090
  host_data_root: C:/DataSet
  container_data_root: /workspace/DataSet
  pcd_dir: /workspace/DataSet/PCD512_v2   # 直下に症例フォルダ。論文の z 側 (A)
  eid_dir: /workspace/DataSet/EID_v5      # 論文の x 側 (B)
  align_meta: /workspace/DataSet/align_meta.yaml   # ケース 2 用。sampling=aligned のときだけ存在を検査
  checkpoints_dir: /workspace/stage1/checkpoints   # この下に run（yyyy_mmdd_HHMM）。レイアウトは stage1/util/run_paths.py
  num_threads: 8
  tb_port: 6006            
  
PC2:                                   # 研究室 Windows 機
  gpu_gen: 30                          # 30 | 40 | 50 | 0(CPU)。起動する compose の選択に使う
  gpu_name: RTX 3070
  host_data_root: "D:/DataSet/DataSet"
  container_data_root: /workspace/DataSet
  pcd_dir: /workspace/DataSet/PCD512_v2   # 直下に症例フォルダ。論文の z 側 (A)
  eid_dir: /workspace/DataSet/EID_v5      # 論文の x 側 (B)
  align_meta: /workspace/DataSet/align_meta.yaml   # ケース 2 用。sampling=aligned のときだけ存在を検査
  checkpoints_dir: /workspace/stage1/checkpoints   # この下に run（yyyy_mmdd_HHMM）。レイアウトは stage1/util/run_paths.py
  num_threads: 8
  tb_port: 6006            # TensorBoard（ホスト:コンテナ 同番号で公開）

mac:                                   # 開発機（Docker、CPU）
  gpu_gen: 0
  gpu_name: Apple M4 (CPU)
  host_data_root: /Volumes/OTO-SSD/DataSet   # SpicaV3 と同じ外付け SSD
  container_data_root: /workspace/DataSet
  pcd_dir: /workspace/DataSet/PCD512_v2
  eid_dir: /workspace/DataSet/EID_v5
  align_meta: ""
  checkpoints_dir: /workspace/stage1/checkpoints
  num_threads: 2
  tb_port: 6006
