# configs/shared.yaml — 新しい Stage 1 / Stage 2 で共有する値（2026-11-11。docs/plans/20261111_detail_design/RECONCILE.md #1）。
# 各 Stage の schema（stage1/configs/schema.py の SHARED など）が、自分の使うキーだけ検査する。既定値は無い。
brightness:
  sigma_px_512: 20.0   # 明るさを平均する広さ σ_a（Gaussian の σ、512 の画素）。Stage 1 の錨（描くときだけ）と Stage 2 で同じ値を使う（1024 では 2 倍 = 40）。
                       # (c) 手がかりの粗さ σ_b（10 px）の 2 倍以上（Stage 1 が起動時に検査）。EXP-20261115-02 #5。2026-11-14 までは 16（1024 で 32）。
                       # Stage 2 では V の patch.margin ≥ 3 × 40 = 120、U の patch.size > 2 × 120 が要る（stage2/configs/schema.py が検査）。
                       # 前の値（16）で作った疑似 EID の組・U の重みとは混ぜられない（Stage 2 が起動前に止める）
