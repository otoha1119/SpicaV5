# stage3/configs/infer.yaml — Stage 3 推論（bash start3.sh infer）の方式。唯一の正は configs/schema.py の INFER。既定値は無い。
# 重みディレクトリ・入力フォルダは infer_stage3.sh の WEIGHT_DIR / INPUT_DIR（--weight_dir / --input_dir で上書き可）。デバイスは machines.yaml の gpu_gen。
# ネットの構成（ddim.yml）と HU 正規化は run の launch.yaml、512 入力の補間方式と学習画像の一辺は run の dataset_info.yaml から取る（学習と同じ）。
# 1024 は 256 タイルに分けて毎ステップ重なりの ε を平均する（WeatherDiffusion 型、決定 7）。所要時間は「タイル数 × sample_steps」に比例する。
# 1 本目の評価（決定 7）: val 2 症例 × 10 枚 = bash start3.sh infer --cases PCD-017,PCD-018 --slices_per_case 10（INPUT_DIR = eidlike1024_dir）

input: eidlike           # eidlike（PCD 症例の EID-like1024 / 512）| eid（実 EID512。--input eid --teacher false）
cases: []                # 推論する症例フォルダ名（[] で INPUT_DIR の全症例）。--cases PCD-017,PCD-018
max_slices: 0            # 0 で全部（cases・slices_per_case で絞った後に効く）
slices_per_case: 0       # 症例ごとに等間隔に間引く枚数（0 で全部）。1 本目の評価は 10
teacher: true            # pcd1024_dir に同名スライスがある入力向け（metrics.txt）。実 EID は false
save_input1024: true     # 512 入力を補間したとき、その 1024 入力も full_input1024/ に残す（NPS で入力側にも使う）
save_panel: false        # 表示用パネル（Stage 2 と同じ 5 列）
eid_slice: EID-049/EID-049-079.png   # input=eidlike のときパネル 4・5 列目の実 EID（eid_dir 相対）。"" で無し
pcd_slice: PCD-002/PCD-002-236.png   # input=eid のときパネル 1〜3 列目の参照 PCD 症例。"" で無し

use_ema: true            # EMA の重みでサンプリング（本家 sample() と同じ）
sample_steps: 50         # DDIM の S（決定 7: 既定 50。評価で 10 / 20 / 50 / 100 を振る）。T = 1000 の約数にする
eta: 0.0                 # 0 = 決定的 DDIM
skip_type: uniform       # 本家 --skip_type uniform（論文の linear）| quad
seed: 1234               # x_T の seed（スライスの相対パスと組み合わせてスライスごとに別。同じ seed なら同じ結果）
tile_stride: 128         # タイル合成の stride r（決定 7: 128 = 49 タイル。64 = 169 タイル）
tile_batch: 16           # タイルを何枚ずつ ε-net に通すか（VRAM と相談。学習と同じ GPU なら小さく）
