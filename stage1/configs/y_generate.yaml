# stage1/configs/y_generate.yaml — 型 Y の疑似 EID の作成（bash start.sh PC1 ygen --run <型 Y の run> [--flag value]）。唯一の正は schema の Y_GENERATE。
# 手順: PCD → 消し手 A → m。m に強さ s のノイズを足し、実 EID の描き手 E で s から 0 まで描き直す（Euler ancestral、毎段に新しい乱数）。
# 出力: <pseudo_eid_dir>/<組>/k00…/<症例>/<スライス>.png と manifest.yaml。組の名前 = Y_<run>-<step>[_ax<倍率>][_E<e_run>-<step>]_sl<s の並び>_st<段の並び>_b<cue>[_anc][_<suffix>]（s_list_hu が空なら _s<s>）
# 2026-11-15: EXP-20261115-02 の値（手がかり 10 px、描き直し 400 → 100 → 50 HU・各 40 段、A の広さの倍率 1）。
# 2026-11-25: 今の作り方（仕様書 fixedA、EXP-20261125-04）の値にした: 固定のぼかし（redraw.fixed_sigma_px > 0。A の run を読まない）+ 1 回の描き直し（s_hu を steps 段）。
#   起動: bash start.sh PC3 ygen --e_run <E の run>。組の名前 = Yfix_g<幅>_E<e_run>-<step>_s<s>_n<段>_b<cue>[_anc]
#   A の run を使う前の作り方（アブレーション）: --fixed_sigma_px 0 --run <A の run> [--a_sigma_scale 0.65] --s_list_hu 400,100,50 --steps_list 40,40,40
generate:
  run: ""
  tag: latest
  e_run: ""                # 描き直しの E。空なら A の学習に使った E（init.e_run）
  e_tag: latest
  input_dir: ""
  cases: []
  slices: []
  slice_step: 1
  max_slices: 0
  k: 1
  seed: 1234
  name_suffix: ""

redraw:
  fixed_sigma_px: 1.45     # 固定のぼかしの幅（512 の画素）。0 = A の run を使う。(d) 仮置き: 今の V（run 2026_1120_1854）の学習に使った組（11-16、global の A × 0.65）の実際の幅と同じ値。選ぶ指標は未定（value_ledger S1-G-15）
  use_eraser: true         # false = A を通さない（PCD に直接ノイズ s を足して描き直す。比較用）
  a_sigma_scale: 1.0       # A のぼかしの広さを推論時に何倍にするか（向きのないぼかしだけ）。1 = 学習のまま（EXP-20261115-02: 手で合わせない）。前の作り方は --a_sigma_scale 0.5（EXP-20261112-01）
  s_hu: 400.0              # 描き直しの出発点 s（HU）。(b) 弱: 400 HU から描き直すと粒の入れ替わりがぼかしの幅に依らない（EXP-20261112-01、3 往復での測定）。候補の値で、選ぶ指標は未定（value_ledger S1-G-16）
  s_list_hu: []            # 往復ごとの s（HU）の並び。空 = s_hu を cycles 回（今は 1 回の描き直し）。前の作り方は ["400", "100", "50"]（3 往復。文献の根拠なし、EXP-20261117-04）
  steps_list: []           # 往復ごとの段数の並び。空 = steps
  cycles: 1                # s_list_hu を使うときは 1
  steps: 120               # 1 回の描き直しの段数。(b) 弱: 実 EID を描き直したときの軟部ノイズの比が 40 段 0.88、120 段 0.99（EXP-20261117-03）。60・80 段は測っていない（value_ledger S1-G-17）
  cue_blur_px: 10.0        # A の学習（dmd.cue_blur_px）と同じ = E の学習の上端。(b) 弱 EXP-20261115-02 #2
  anchor: true
  batch: 4
  precision: bf16
