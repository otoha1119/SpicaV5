# stage1/configs/train.yaml — 学習パラメータ（FE-GAN = Park et al. 2019 が使うものを全部）
# 唯一の正は configs/schema.py（キーの欠落・未知・型違いはエラー）。既定値は無い。
# 書き方: 小数は必ず点を付ける（0.0002, 1.0e-4）。真偽値は true / false。
# 実験名 (--name) はここに書かない。run_train.py が起動時刻 yyyy_mmdd_HHMM から生成する（レイアウトは util/run_paths.py）。

optim:
  lr: 0.0002            # 論文 "learning rate of 0.0002"
  beta1: 0.5            # Adam β1。論文未記載 (Q-T1)。junyanz 慣行
  beta2: 0.999          # Adam β2。論文未記載
  batch_size: 40        # 論文 "mini-batch size of 40"
  n_epochs: 300         # 論文 "300 epochs"
  n_epochs_decay: 0     # 論文未記載 (Q-T2)。減衰なし
  lr_policy: linear     # decay 0 なら定常。再開が対応するのは linear のみ
  seed: 0               # python / numpy / torch の乱数 seed（再現条件）。cudnn.benchmark は本家のままなので完全決定ではない

loss:
  lambda_fid:  100.0      # 論文 "We empirically choose λ = 10"。範囲 [−1,1] では再整対象

network:
  ngf: 32               # Fig. 3 G 最初の段
  ndf: 32               # Fig. 3 D 1 層目
  norm: batch           # 論文 "batch normalization"。wavelet / paper は BN 固定
  init_type: normal     # 論文 "Gaussian distribution with a mean of 0"
  init_gain: 0.01       # 論文 "standard deviation of 0.01"
  input_nc: 1           # grayscale
  output_nc: 1

data:
  patch_size: 128       # 論文 "patches of size 128 × 128"
  patch_stride: 1       # random: 任意位置（1）。sampling=paper のときは論文の 8 を明示する
  patches_per_image: 40 # sampling=paper 用。論文 "40 patches"
  patch_seed: 0
  samples_per_epoch: 24000   # sampling=random の epoch 長。論文の patch 集合と同数（batch 40 → 600 iter/epoch）
  patches_per_slice: 8       # 1 回読んだスライス（A / B それぞれ）から連続して切る patch 数（random のみ。位置は毎回独立）。1 = patch ごとに別スライス（2026-10-12 以前の挙動）。
                             # 8 で読み出し・デコードが 1/8（PC1 の sr で大幅高速化。degrade にも共通して効くのでユーザー指示で既定を 8 に。2026-10-12）
  hu_offset: 1400       # stored = HU + 1400
  hu_min: -1400         # 正規化窓 [−1400, 4096] → [−1, 1]
  hu_max: 4096

noise:                  # 乱数画像 n の振幅（mode.yaml noise_input: true のときだけ使われる。false でもキーは必須。段階 5-5、2026-10-12）
  sigma_hu_min: 15.0    # 学習ではサンプルごとに log-uniform [min, max] HU から sigma を引く。正規化空間では sigma_hu / ((hu_max − hu_min) / 2)（= ÷2748）
  sigma_hu_max: 60.0    # 仮決め（docs/decisions/20261012: 中央 30 HU は冠動脈 CTA の EID の一般値で未測定。実測後は両端を同倍率でずらし比 ×4 を維持）

log:
  # 単位: print_freq / image_freq は step（iteration。batch_size 枚で 1 step）、save_latest_freq は画像枚数（junyanz 由来）
  print_freq: 100         # バー末尾の損失・TensorBoard scalar・loss_log.txt の更新間隔（step）
  image_freq: 200         # TensorBoard の途中画像の間隔（step）。1 epoch = 600 step（batch 40）なので 3 回/epoch（sr.yaml と同じ。2026-10-13）
  n_images: 4             # TensorBoard の途中画像の枚数（current の枚数。fixed は fixed_patches が random のときだけこの枚数。128 patch。ディスクには書かない）
  fixed_patches: crop     # images/fixed の切り方: crop = crop_file の cases（PCD / EID のスライスと左上座標）に学習 patch の中心を合わせて切る（枚数 = cases の数。bash start.sh crop で見ている場所を学習中にも追う。ユーザー指示 2026-10-13）| random = patch_seed から決まるランダム n_images 枚（導入前の挙動）
  crop_file: configs/crop.yaml   # fixed_patches が crop のとき読む crop.yaml（stage1/ からの相対パス。cases と patch だけ使う。sr のときは座標は 1024 の画素、A = eid・B = pcd）
  full_slice: PCD-002/PCD-002-215.png   # 毎 epoch フル 512 で書き出す固定スライス（pcd_dir からの相対パス）→ output_images/epoch_NNN/ と preview_fixed_<slice>/。task: sr では sr.yaml の train: が EID 側に差し替える
  eid_slice: EID-001/EID-001-089.png    # パネル右端に並べる EID の代表スライス（eid_dir からの相対パス。固定）→ preview_fixed_<slice>/01_eid_<slice>.png にも 1 枚
  n_full_random: 1        # 加えて epoch ごとに別のランダムスライスを何枚書くか → output_images/epoch_NNN/ と preview_random/
  display_hu_min: -1400   # 表示の線形範囲（stored 0 = HU −1400）。TB と preview_<slice>/ に共通
  display_hu_max: 2100    # （stored 3500 = HU 2100）。この範囲を線形に 0..白へ（窓は掛けない）
  preview_bits: 16        # output_images/preview_*/（[EID | EID-like | PCD | R + ゲージ] のパネルと個別画像）のビット深度。16 = 表示範囲を 0..65535 に伸ばす | 8
  diff_range_hu: 300      # 差分パネル（R = G(z) − z）のカラー表示の ±範囲 HU。白 = 0、純青 = −300、純赤 = +300、範囲外は飽和。推論の *_R_color/ と crop もこの現在値を使う（run の launch.yaml ではない）
  save_epoch_freq: 1      # 毎 epoch 重み（weights/epoch_NNN/）とフル 512 画像を保存し、後から最良 epoch を選べるようにする（300 epoch で重み ≈ 5 GB + 画像 ≈ 1 GB）
  save_latest_freq: 5000  # 画像枚数（batch 40 なら 125 step ごと）
  continue_train: false
  epoch_count: 1
