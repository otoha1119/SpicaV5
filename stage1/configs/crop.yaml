# stage1/configs/crop.yaml — パッチ切り出し（bash start.sh crop）の設定。唯一の正は configs/schema.py の CROP（cases は check_crop_cases）。既定値は無い。
# 指定した PCD スライスを 512 のフル推論にかけ、左上 (x, y) から patch 四方を切り出して、EID の代表パッチと並べる（スライド用）。
# 重みディレクトリは crop_stage1.sh の WEIGHT_DIR（--weight_dir で上書き可）。G の構成は run の launch.yaml から、表示（display_hu_*、preview_bits、diff_range_hu）は現在の configs/train.yaml の log から。
# 出力は <run>/infer/<重みディレクトリ名>/crop/<実行時刻>/case<N>_<pcd>_<eid>/（レイアウトは util/run_paths.py）。
# 学習中に同じコンテナで走らせてよい（start.sh は起動済みコンテナに exec するだけ。device: cpu なら VRAM も取り合わない）。

patch: 72             # 切り出す正方形の一辺（画素）。座標は左上
panel_scale: 4        # 並べたパネルだけ最近傍で拡大（72 → 288）。個別画像は等倍。余白・ラベル・ゲージは列の高さに比例（preview_*/ の 512 パネルと相似形。2026-09-10）ので、等倍で文字まで読みたければ 7（→ 504 ≈ 512）
device: cpu           # cpu | cuda。学習中は cpu（512 を数枚通すだけなので数秒）

cases:                # PCD と EID のペア。スライス名（PCD-nnn-sss / EID-nnn-sss）と左上座標。ファイルは pcd_dir/<PCD-nnn>/<name>.png、eid_dir/<EID-nnn>/<name>.png
                      # run の task が sr のときは pcd1024_dir / eid1024_dir のスライスを読み、eid が入力（eid_x/y で入力・G(z)・R を切る）、pcd が参照。座標は 1024 の画素で書く（2026-10-12）
  # --- 新データ（DataSet_new、PC1_new）のプラーク領域。座標はプラーク中心から patch/2 = 36 を引いた左上（PCD512 = 選定表の 1024 座標 ÷ 2、EID は 512 座標そのまま）。選定表 1 行目（PCD-plaque-eval/plaques.csv、2026-10-28）---
  - pcd: PCD-021-135
    pcd_x: 197          # 中心 (466, 588) ÷ 2 = (233, 294) − 36
    pcd_y: 258
    eid: EID-1021-038
    eid_x: 216          # 中心 (252, 321) − 36
    eid_y: 285
  # --- 旧データ（PCD512_v2 / EID_v5）のケース。旧データのマシンで crop するときはこちらに戻す ---
