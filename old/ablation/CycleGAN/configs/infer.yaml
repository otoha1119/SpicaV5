# ablation/CycleGAN/configs/infer.yaml — 推論（bash start_ablation.sh <マシン> CycleGAN infer）の方式。唯一の正は configs/schema.py の INFER。既定値は無い。
# 重みディレクトリ・入力フォルダは infer.sh の WEIGHT_DIR / INPUT_DIR（--weight_dir / --input_dir で上書き可）。デバイスは machines.yaml の gpu_gen（0 → cpu）。
# G_A（1024 → 1024）の構成と HU 正規化は run の launch.yaml から。入力は 1024（EID1024_v1 など）はそのまま、512（実 EID_v5）は launch の upsample（eid1024_dir/manifest.yaml の方式）で補間してから通す（補間した入力は full_input/ に残す）。
# 出力は <repo>/output/ablation/CycleGAN/<run>_<重み>_<入力名>_<実行時刻>/（util/run_paths.py）。patch 推論・DICOM 出力は未対応。

max_slices: 0           # 0 で全スライス。動作確認は 4 など
batch_slices: 1         # 同時に G_A に通すスライス数（1024 フル）。3070 8GB は 1、24 GB なら 4
save_residual: false    # R = G_A(z) − z（16bit、0 HU = 32768）と表示用カラーも書くか
save_panel: false       # 表示用パネル [PCD-like1024 | EID1024 | R + ゲージ] も書くか（目視確認用。--save_panel true --max_slices 1）

io:
  read_workers: 4       # PNG の読み込み・デコードを先読みするスレッド数（0 = 直列）
  write_workers: 2      # PNG の書き込みを非同期にするスレッド数（0 = 直列）
